name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build an unsigned release APK'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Capacitor 8 CLI writes Java 21 compile options into the Android project; Gradle 8.9 supports JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # the Capacitor 8 CLI needs Node 22 or newer

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The default also installs the retired 'tools' package, which newer sdkmanager versions no longer have.
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      # Catch a broken script before spending minutes on a Gradle build that would
      # happily package it. A parse error in these files ships as a blank screen.
      - name: Check web assets parse
        run: |
          for f in www/js/*.js; do
            node --check "$f" || { echo "::error file=$f::JavaScript parse error"; exit 1; }
          done
          test -f www/index.html || { echo "::error::www/index.html missing"; exit 1; }
          echo "All web assets parse."

      - name: Copy web assets into the native project
        run: npx cap sync android

      - name: Confirm assets reached the native project
        run: |
          test -f android/app/src/main/assets/public/index.html \
            || { echo "::error::cap sync did not populate assets/public"; exit 1; }
          echo "Synced $(find android/app/src/main/assets/public -type f | wc -l) files."

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::no APK produced"; exit 1; }
          echo "Built $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -q 'assets/public/index.html' \
            || { echo "::error::APK does not contain the web assets"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/public/js/qpdata.js' \
            || { echo "::error::APK is missing the formation library"; exit 1; }
          echo "APK contains the web bundle."

      - name: Build release APK (unsigned)
        if: ${{ inputs.release }}
        run: |
          cd android
          # build.gradle refuses an unsigned release unless asked; this job has no signing key.
          ./gradlew assembleRelease --no-daemon --stacktrace -PQIPATH_ALLOW_UNSIGNED=true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QiPathPro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: QiPathPro-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
