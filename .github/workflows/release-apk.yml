name: Signed Release APK

# Builds a signed release APK in the cloud, so a release can be made from a phone: GitHub app > Actions >
# Signed Release APK > Run workflow. It runs the same `npm run release` as a PC (tools/release.js), which refuses
# an APK not signed by the QiPath Pro certificate.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions), set once by the owner:
#   QIPATH_KEYSTORE_BASE64  the key file, base64-encoded
#   QIPATH_KEY_ALIAS        the key alias
#   QIPATH_STORE_PASSWORD   the key store password
#   QIPATH_KEY_PASSWORD     the key password
# Secrets cannot be read back once saved, and GitHub masks them in logs. The key file exists only during the run.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also attach the APK to a public GitHub Release (vX.Y.Z). This repository is public.'
        type: boolean
        default: false
      dry:
        description: 'Test only: build an unsigned release without the key'
        type: boolean
        default: false

concurrency:
  group: signed-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Capacitor 8 CLI writes Java 21 compile options into the Android project (see build-apk.yml).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # the Capacitor 8 CLI needs Node 22 or newer

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The default also installs the retired 'tools' package, which newer sdkmanager versions no longer have.
        with:
          packages: 'platform-tools'

      - name: Read the version
        run: |
          chmod +x android/gradlew
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Restore the signing key
        if: ${{ !inputs.dry }}
        env:
          KEYSTORE_B64: ${{ secrets.QIPATH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The QIPATH_KEYSTORE_BASE64 secret is not set. See README, 'Signed release from your phone'."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/qipath.keystore"
          echo "QIPATH_STORE_FILE=$RUNNER_TEMP/qipath.keystore" >> "$GITHUB_ENV"

      - name: Build, sign and check
        env:
          QIPATH_KEY_ALIAS: ${{ secrets.QIPATH_KEY_ALIAS }}
          QIPATH_STORE_PASSWORD: ${{ secrets.QIPATH_STORE_PASSWORD }}
          QIPATH_KEY_PASSWORD: ${{ secrets.QIPATH_KEY_PASSWORD }}
        run: npm run release -- --out dist ${{ inputs.dry && '--dry' || '' }}

      - name: Remove the key file
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/qipath.keystore"

      - name: Upload the signed APK
        if: ${{ !inputs.dry }}
        uses: actions/upload-artifact@v4
        with:
          name: QiPathPro-${{ env.VERSION }}-signed-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload the test APK (unsigned)
        if: ${{ inputs.dry }}
        uses: actions/upload-artifact@v4
        with:
          name: QiPathPro-${{ env.VERSION }}-unsigned-test
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish a GitHub Release
        if: ${{ inputs.publish && !inputs.dry }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --title "QiPath Pro $VERSION" \
              --notes "Signed release APK built by the Signed Release APK workflow."
          fi
