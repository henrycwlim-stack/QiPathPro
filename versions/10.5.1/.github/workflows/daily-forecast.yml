name: Daily forecast email

# Reads today against the person's BaZi, Qimen and Zi Wei charts, with the Tong Shu almanac, the best and worst hours and
# good directions (tools/daily-forecast.js), and emails it through Gmail. Uses the same repository secrets as the Qimen
# structures email: QP_SMTP_USER, QP_SMTP_PASS (a Gmail app password), QP_MAIL_TO, and QP_BIRTH for the personal readings.
# Run it by hand with "preview" ticked to build the email as a downloadable file without sending.

on:
  schedule:
    # 22:00 UTC is 06:00 the next morning in Singapore, the same time as the structures email.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview only: build the email as a file to download, do not send'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      # The engine reads dates as local civil time, as it does on the phone.
      TZ: Asia/Singapore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the email secrets
        if: ${{ !inputs.preview }}
        env:
          QP_SMTP_USER: ${{ secrets.QP_SMTP_USER }}
          QP_SMTP_PASS: ${{ secrets.QP_SMTP_PASS }}
          QP_MAIL_TO: ${{ secrets.QP_MAIL_TO }}
          QP_BIRTH: ${{ secrets.QP_BIRTH }}
        run: |
          missing=""
          [ -n "$QP_SMTP_USER" ] || missing="$missing QP_SMTP_USER"
          [ -n "$QP_SMTP_PASS" ] || missing="$missing QP_SMTP_PASS"
          [ -n "$QP_MAIL_TO" ] || missing="$missing QP_MAIL_TO"
          if [ -n "$missing" ]; then
            echo "::error::The forecast cannot be sent until these repository secrets are added:$missing. See README, 'Setting up the 06:00 email'."
            exit 1
          fi
          [ -n "$QP_BIRTH" ] || echo "::warning::QP_BIRTH is not set, so the BaZi, Qimen and Zi Wei readings are left out."

      - name: Install the mailer
        if: ${{ !inputs.preview }}
        run: npm install --no-save --no-package-lock nodemailer@6.9.16

      - name: Build the preview
        if: ${{ inputs.preview }}
        env:
          DRY_RUN: '1'
          QP_BIRTH: ${{ secrets.QP_BIRTH }}
        run: node tools/daily-forecast.js

      - name: Upload the preview
        if: ${{ inputs.preview }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-forecast-preview
          path: daily-forecast.html
          if-no-files-found: error

      - name: Read the day and send
        if: ${{ !inputs.preview }}
        env:
          QP_SMTP_USER: ${{ secrets.QP_SMTP_USER }}
          QP_SMTP_PASS: ${{ secrets.QP_SMTP_PASS }}
          QP_MAIL_TO: ${{ secrets.QP_MAIL_TO }}
          QP_BIRTH: ${{ secrets.QP_BIRTH }}
        run: node tools/daily-forecast.js
