name: Update draw results

# The app runs in a WebView and cannot execute Python, and Singapore Pools sends no CORS
# header so the app cannot read it directly either. This workflow closes that gap: it runs
# the scraper on GitHub's servers on the draw schedule and commits the results back to this
# repository, where raw.githubusercontent.com serves them with `access-control-allow-origin: *`
# and the app can fetch them automatically.

on:
  schedule:
    # Singapore Pools draws: 4D on Wed/Sat/Sun, TOTO on Mon/Thu, all evening SGT.
    # Cron is UTC, so 15:30 UTC is 23:30 SGT — after the draw, same day.
    - cron: '30 15 * * 1,3,4,6,0'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'How many recent draws to fetch'
        type: string
        default: '5'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Scrape the latest draws
        id: scrape
        continue-on-error: true
        run: |
          mkdir -p data
          N="${{ inputs.backfill || '5' }}"
          python tools/sp_scraper.py --game 4d   --last "$N" --merge data/4d_prizes.csv   || true
          python tools/sp_scraper.py --game toto --last "$N" --merge data/toto_prizes.csv || true

      - name: Report what was collected
        run: |
          for f in data/4d_prizes.csv data/toto_prizes.csv; do
            if [ -f "$f" ]; then
              echo "$f: $(( $(wc -l < "$f") - 1 )) rows"
            else
              echo "$f: not produced"
            fi
          done

      # A layout change on the source site should fail loudly rather than silently
      # committing an empty file over good data.
      - name: Guard against empty output
        run: |
          for f in data/4d_prizes.csv data/toto_prizes.csv; do
            if [ -f "$f" ] && [ "$(wc -l < "$f")" -lt 2 ]; then
              echo "::error file=$f::scraper produced a header-only file — the page layout has probably changed"
              exit 1
            fi
          done

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No new draws."
          else
            git commit -m "Draw results: $(date -u +%Y-%m-%d)"
            git push
            echo "Committed new draws."
          fi

      - name: Upload as an artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draw-results
          path: data/*.csv
          if-no-files-found: ignore
